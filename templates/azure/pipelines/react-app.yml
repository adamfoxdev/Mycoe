# ── React App — Azure DevOps Pipeline ────────────────────────
# Triggers on changes to the react-app template or any app using it.
# Replace 'templates/react-app' with your application's path.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - templates/react-app/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - templates/react-app/**

variables:
  nodeVersion: '20.x'
  workingDirectory: 'templates/react-app'

stages:
  # ── CI ─────────────────────────────────────────────────────
  - stage: CI
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Lint & Test'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm ci
            workingDirectory: $(workingDirectory)
            displayName: 'Install dependencies'

          - script: npm run lint
            workingDirectory: $(workingDirectory)
            displayName: 'Lint'

          - script: npm run type-check
            workingDirectory: $(workingDirectory)
            displayName: 'Type check'

          - script: npm run test:coverage
            workingDirectory: $(workingDirectory)
            displayName: 'Test with coverage'

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(workingDirectory)/coverage/junit.xml'

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: '$(workingDirectory)/coverage/lcov.info'

          - script: npm run build
            workingDirectory: $(workingDirectory)
            displayName: 'Build'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(workingDirectory)/dist'
              artifactName: 'react-app-dist'

  # ── Deploy to Dev ──────────────────────────────────────────
  - stage: DeployDev
    displayName: 'Deploy — Dev'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        displayName: 'Deploy to Azure Static Web Apps (Dev)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  inputs:
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_DEV)
                    app_location: '/'
                    output_location: 'dist'

  # ── Deploy to Production ───────────────────────────────────
  - stage: DeployPrd
    displayName: 'Deploy — Production'
    dependsOn: DeployDev
    jobs:
      - deployment: Deploy
        displayName: 'Deploy to Azure Static Web Apps (Production)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'   # Configured with manual approval gate in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureStaticWebApp@0
                  inputs:
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_PRD)
                    app_location: '/'
                    output_location: 'dist'
