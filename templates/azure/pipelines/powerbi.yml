# Power BI Deployment Pipeline — Azure DevOps
# Uses the Power BI REST API and PBIP format to deploy reports and datasets.
# Prerequisites:
#   - Service Principal with Power BI Workspace Admin
#   - PBIP files committed to source control (not .pbix)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - templates/powerbi/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - templates/powerbi/**

variables:
  powerBIWorkspaceDev: $(POWERBI_WORKSPACE_ID_DEV)
  powerBIWorkspacePrd: $(POWERBI_WORKSPACE_ID_PRD)

stages:
  - stage: DeployDev
    displayName: 'Deploy — Dev Workspace'
    jobs:
      - deployment: Deploy
        pool:
          vmImage: 'windows-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: 'Install Power BI Management module'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Install-Module -Name MicrosoftPowerBIMgmt -Force -Scope CurrentUser

                - task: PowerShell@2
                  displayName: 'Publish to Dev workspace'
                  env:
                    POWERBI_CLIENT_ID: $(POWERBI_CLIENT_ID)
                    POWERBI_CLIENT_SECRET: $(POWERBI_CLIENT_SECRET)
                    POWERBI_TENANT_ID: $(POWERBI_TENANT_ID)
                  inputs:
                    targetType: 'inline'
                    script: |
                      $credential = New-Object System.Management.Automation.PSCredential(
                          $env:POWERBI_CLIENT_ID,
                          (ConvertTo-SecureString $env:POWERBI_CLIENT_SECRET -AsPlainText -Force)
                      )
                      Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId $env:POWERBI_TENANT_ID
                      # Import each .pbip report found in the powerbi template folder
                      Get-ChildItem -Path "$(Build.SourcesDirectory)/templates/powerbi" -Filter "*.pbip" -Recurse | ForEach-Object {
                          New-PowerBIReport -Path $_.FullName -WorkspaceId "$(powerBIWorkspaceDev)" -ConflictAction CreateOrOverwrite
                      }

  - stage: DeployPrd
    displayName: 'Deploy — Production Workspace'
    dependsOn: DeployDev
    jobs:
      - deployment: Deploy
        pool:
          vmImage: 'windows-latest'
        environment: 'production'   # Requires manual approval gate
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: 'Promote via Deployment Pipeline'
                  env:
                    POWERBI_CLIENT_ID: $(POWERBI_CLIENT_ID)
                    POWERBI_CLIENT_SECRET: $(POWERBI_CLIENT_SECRET)
                    POWERBI_TENANT_ID: $(POWERBI_TENANT_ID)
                    POWERBI_PIPELINE_ID: $(POWERBI_PIPELINE_ID)
                  inputs:
                    targetType: 'inline'
                    script: |
                      Install-Module -Name MicrosoftPowerBIMgmt -Force -Scope CurrentUser
                      $credential = New-Object System.Management.Automation.PSCredential(
                          $env:POWERBI_CLIENT_ID,
                          (ConvertTo-SecureString $env:POWERBI_CLIENT_SECRET -AsPlainText -Force)
                      )
                      Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId $env:POWERBI_TENANT_ID
                      # Trigger promotion from UAT stage (stage index 1) to Production (stage index 2)
                      $url = "https://api.powerbi.com/v1.0/myorg/pipelines/$env:POWERBI_PIPELINE_ID/deployAll"
                      Invoke-PowerBIRestMethod -Url $url -Method Post -Body '{"sourceStageOrder":1}'
