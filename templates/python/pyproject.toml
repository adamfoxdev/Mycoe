[project]
name = "mycoe-python-template"
version = "1.0.0"
description = "Mycoe Python project template"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes; I: isort; UP: pyupgrade;
# B: flake8-bugbear; SIM: flake8-simplify; ANN: flake8-annotations
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest: test discovery and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
